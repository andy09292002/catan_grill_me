<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a1626" />
    <title>Hex Board</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="board" aria-label="Game board"></canvas>

    <!-- Corner contents turn towards the current player; the corners themselves stay put. -->
    <div class="corner top-left">
      <div id="history" class="history" aria-label="Rolls">
        <div class="rot history-inner">
          <div class="history-label">Last roll</div>
          <div id="last-roll" class="last-roll">–</div>
          <div id="recent" class="recent"></div>
        </div>
      </div>
    </div>

    <div class="corner top-right">
      <button id="move-thief" class="control small" type="button" aria-label="Move the thief" hidden>
        <span class="rot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.2" /><path d="M6.5 20c0-6 2.2-8.6 5.5-8.6s5.5 2.6 5.5 8.6z" /></svg>
          <span>Thief</span>
        </span>
      </button>
      <button id="new-game" class="control" type="button" aria-label="New game">
        <span class="rot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9zM12 9v6M9 12h6" /></svg>
          <span>New game</span>
        </span>
      </button>
    </div>

    <div class="corner bottom-left">
      <button id="next-turn" class="control next" type="button" aria-label="Next turn">
        <span class="rot">
          <span id="turn-dot" class="turn-dot"></span>
          <span>Next turn</span>
        </span>
      </button>
    </div>

    <div class="corner bottom-right">
      <button id="pad-open" class="control small" type="button" aria-label="Enter physical dice total">
        <span class="rot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16" /></svg>
          <span>Enter</span>
        </span>
      </button>
      <button id="roll" class="control roll" type="button" aria-label="Roll the dice">
        <span class="rot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" /><circle cx="8.5" cy="8.5" r="1.2" /><circle cx="15.5" cy="15.5" r="1.2" /><circle cx="12" cy="12" r="1.2" /></svg>
          <span>Roll</span>
        </span>
      </button>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
