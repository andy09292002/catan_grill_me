name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
        env:
          SCREENSHOT_BROWSER: chromium
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
